<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a101d"><title>L99 Trading Journal</title>
<style>
:root{--bg:#0a101d;--cd:#111a2e;--bd:#223250;--tx:#e8edf7;--mu:#8b98b3;--au:#d4af37;--bl:#4f8cff;--g:#22c55e;--r:#ef4444;--n:#8b98b3}
[data-t=light]{--bg:#f3f5fa;--cd:#fff;--bd:#d9dfec;--tx:#111827;--mu:#5b6578}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,sans-serif}
h1{font-size:22px;margin:4px 0 12px}h3{margin:0 0 10px;font-size:15px;color:var(--au)}
nav{position:fixed;z-index:5;background:var(--cd);border-top:1px solid var(--bd);bottom:0;left:0;right:0;display:flex;overflow-x:auto;padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
nav a{flex:0 0 auto;padding:7px 11px;color:var(--mu);text-decoration:none;font-size:11px;text-align:center;white-space:nowrap;border-radius:10px}
nav a.on{color:var(--au);background:rgba(212,175,55,.12)}nav a i{display:block;font-style:normal;font-size:18px}.lg{display:none}
main{padding:calc(12px + env(safe-area-inset-top)) 14px 96px;max-width:1150px;margin:auto}
@media(min-width:800px){nav{top:0;bottom:auto;right:auto;width:200px;flex-direction:column;border:0;border-right:1px solid var(--bd);padding:14px 10px}nav a{text-align:left;font-size:14px}nav a i{display:inline;margin-right:8px}.lg{display:block;color:var(--au);font-weight:700;font-size:18px;padding:6px 10px 14px}main{margin-left:200px;padding-bottom:30px;max-width:none}}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin-bottom:12px}.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:8px 0}
.k{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px}.k small{color:var(--mu);display:block;font-size:12px}.k b{font-size:20px}
.pos{color:var(--g)}.neg{color:var(--r)}.ne{color:var(--n)}.mu{color:var(--mu)}.au{color:var(--au)}
label{display:block;font-size:12px;color:var(--mu)}input,select,textarea,.btn{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px;font:inherit;margin-top:3px}
textarea{min-height:60px}.btn{width:auto;cursor:pointer;background:var(--au);color:#0a101d;font-weight:700;border:0;display:inline-block;margin:4px 4px 4px 0}.btn.s{background:var(--bd);color:var(--tx)}.btn.d{background:var(--r);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}.row select,.row input{width:auto;flex:1;min-width:120px}
.ch input{display:none}.ch span{display:inline-block;padding:10px 16px;border:1px solid var(--c,var(--bd));border-radius:10px;color:var(--c,var(--tx));cursor:pointer;font-weight:600;font-size:13px}.ch input:checked+span{background:var(--c,var(--au));color:#0a101d}
details.cd summary{cursor:pointer;font-weight:700;color:var(--au)}.warn{color:#eab308;background:rgba(234,179,8,.1);padding:8px;border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd)}th{color:var(--mu);font-weight:600}.sc{overflow-x:auto}tr.c{cursor:pointer}
.br{display:grid;grid-template-columns:1fr 90px auto;gap:8px;align-items:center;margin:6px 0;font-size:13px}.tr{background:var(--bg);border-radius:6px;height:10px}.tr i{display:block;height:100%;border-radius:6px}
.cols{display:flex;gap:2px;height:100px}.cols i{flex:1;position:relative}.cols b{position:absolute;left:0;right:0;border-radius:2px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal a{border-radius:8px;min-height:50px;padding:4px;font-size:12px;cursor:pointer;color:#0a101d}.cal i{min-height:0}
.th{display:flex;gap:8px;flex-wrap:wrap}.th figure{margin:0;width:120px}.th img{width:120px;height:80px;object-fit:cover;border-radius:8px;cursor:zoom-in}figcaption{font-size:11px;color:var(--mu)}
#ov,#pv{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:20;overflow:auto;padding:14px}#pv{z-index:30;display:flex;align-items:center;justify-content:center}#pv img{max-width:100%;max-height:100%}
.md{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:16px;max-width:760px;margin:auto;position:relative}.x{position:absolute;right:10px;top:10px;padding:4px 10px}
#ts{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--au);color:#0a101d;padding:10px 16px;border-radius:10px;z-index:40;font-weight:600}
[hidden]{display:none!important}@media print{nav,.btn,#ts{display:none!important}main{margin:0}body{background:#fff;color:#000}.cd,.k{border-color:#ccc}}
</style></head><body>
<nav id="nav"></nav><main id="app"></main><div id="ov" hidden></div><div id="pv" hidden onclick="this.hidden=true"></div><div id="ts" hidden></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MK=['Overtrading','Revenge Trading','FOMO','Early Entry','Late Entry','Moving Stop Loss','Excessive Lot Size','Ignoring Market Structure','Emotional Decisions','Breaking Trading Rules','Poor Risk Management'];
const RS=['Market Structure','Liquidity Sweep','Break of Structure (BOS)','Change of Character (CHoCH)','Fair Value Gap (FVG)','Order Block','Support / Resistance','News Event','Emotional Trading','Early Entry','Late Entry','Poor Risk Management','Other'];
const PIP={EURUSD:1e-4,GBPUSD:1e-4,USDJPY:.01,XAUUSD:.1},INS=['XAUUSD','EURUSD','GBPUSD','USDJPY','BTCUSD'],FEEL=['Confident','Calm','Fearful','Greedy','Impatient','Stressed','Emotional'],SES=['Asian','London','New York','Overlap','Other'],YN=['Yes','No','Partially'];
const NV=[['dash','Dashboard','▦'],['add','Add Trade','＋'],['hist','History','☰'],['cal','Calendar','▤'],['ana','Analytics','◔'],['mis','Mistakes','⚠'],['rev','Daily Review','✎'],['rep','Reports','▥'],['set','Settings','⚙']];
let db,T=[],R=[],M=[],EDIT=null,SH=[],F={r:'all',f:'',t:''},H={q:'',i:'',s:'',r:'',f:'',t:'',o:'d'},CM,CD='',RD='',RP={k:'w',a:''};
let S={cur:'USD',tz:'Asia/Karachi',inst:'XAUUSD',theme:'dark',df:'long'};try{S={...S,...JSON.parse(localStorage.jset||'{}')}}catch{}
document.documentElement.dataset.t=S.theme;
/* ---------- storage ---------- */
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('l99Journal',1);r.onupgradeneeded=()=>{[['trades','id'],['reviews','date'],['mstat','name']].forEach(([n,k])=>r.result.createObjectStore(n,{keyPath:k}))};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=(s,m,f)=>new Promise((res,rej)=>{const t=db.transaction(s,m),q=f(t.objectStore(s));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)});
const all=s=>tx(s,'readonly',o=>o.getAll()),put=(s,v)=>tx(s,'readwrite',o=>o.put(v)),del=(s,k)=>tx(s,'readwrite',o=>o.delete(k)),clr=s=>tx(s,'readwrite',o=>o.clear());
const load=async()=>{T=await all('trades');R=await all('reviews');M=await all('mstat')};
/* ---------- helpers ---------- */
const toast=m=>{const t=$('#ts');t.textContent=m;t.hidden=false;clearTimeout(toast.i);toast.i=setTimeout(()=>t.hidden=true,2600)};
const P=ts=>Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:S.tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).formatToParts(ts).map(x=>[x.type,x.value]));
const dk=ts=>{const p=P(ts);return`${p.year}-${p.month}-${p.day}`},inp=ts=>`${dk(ts)}T${P(ts).hour}:${P(ts).minute}`;
const fromInp=v=>{const[d,t]=v.split('T'),[y,m,dd]=d.split('-').map(Number),[h,mi]=t.split(':').map(Number),g=Date.UTC(y,m-1,dd,h,mi),p=P(g);return g-(Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute)-g)};
const fmtD=ts=>S.df=='iso'?dk(ts)+' ('+new Intl.DateTimeFormat('en-GB',{timeZone:S.tz,weekday:'short'}).format(ts)+')':new Intl.DateTimeFormat('en-GB',{timeZone:S.tz,weekday:'long',day:S.df=='dmy'?'2-digit':'numeric',month:S.df=='dmy'?'2-digit':'long',year:'numeric'}).format(ts);
const fmtT=ts=>new Intl.DateTimeFormat('en-US',{timeZone:S.tz,hour:'2-digit',minute:'2-digit',hour12:true}).format(ts),tzn=()=>S.tz=='Asia/Karachi'?'PKT':S.tz;
const money=v=>(v<0?'-':v>0?'+':'')+(S.cur=='USD'?'$':S.cur+' ')+Math.abs(v||0).toFixed(2),cls=v=>v>0?'pos':v<0?'neg':'ne';
const wk=n=>{const d=new Date(n+'T00:00:00Z');d.setUTCDate(d.getUTCDate()-(d.getUTCDay()+6)%7);return d.toISOString().slice(0,10)};
const pm=n=>{const d=new Date(n.slice(0,7)+'-01T00:00:00Z');d.setUTCMonth(d.getUTCMonth()-1);return d.toISOString().slice(0,7)};
const op=(a,c,ph)=>(ph?`<option value="">${ph}</option>`:'')+a.map(x=>`<option ${x==c?'selected':''}>${E(x)}</option>`).join('');
const fi=(id,l,v,t='number',x='')=>`<label>${l}<input id="${id}" type="${t}" ${t=='number'?'step="any" inputmode="decimal"':''} value="${E(v)}" ${x}></label>`;
const sl=(id,l,a,c)=>`<label>${l}<select id="${id}">${op(a,c,'—')}</select></label>`,ta=(id,l,v)=>`<label>${l}<textarea id="${id}">${E(v)}</textarea></label>`;
const rad=(n,a,c)=>a.map(([v,l,k])=>`<label class="ch"><input type="radio" name="${n}" value="${v}" ${c==v?'checked':''}><span style="--c:var(--${k||'au'})">${l}</span></label>`).join('');
const v=id=>$('#'+id)?.value??'',nn=id=>{const x=parseFloat(v(id));return isNaN(x)?null:x},rv=n=>document.querySelector(`input[name=${n}]:checked`)?.value||'';
const dl=(n,t,ty='text/csv')=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:ty}));a.download=n;a.click()};
/* ---------- stats ---------- */
function st(l){const w=l.filter(t=>t.res=='P'),x=l.filter(t=>t.res=='L'),s=a=>a.reduce((p,t)=>p+(+t.pl||0),0),r=l.filter(t=>t.rr>0);return{n:l.length,w:w.length,l:x.length,b:l.filter(t=>t.res=='B').length,gp:s(w),gl:s(x),net:s(l),wr:l.length?w.length/l.length*100:0,aw:w.length?s(w)/w.length:0,al:x.length?s(x)/x.length:0,best:Math.max(0,...w.map(t=>t.pl)),worst:Math.min(0,...x.map(t=>t.pl)),rr:r.length?r.reduce((p,t)=>p+t.rr,0)/r.length:0}}
const grp=(l,f)=>{const o={};l.forEach(t=>{const k=f(t);if(!k)return;(o[k]??={n:0,w:0,net:0});o[k].n++;o[k].net+=+t.pl||0;if(t.res=='P')o[k].w++});return o};
const mcount=l=>{const o={};l.forEach(t=>(t.mt||[]).forEach(k=>o[k]=(o[k]||0)+1));return Object.entries(o).sort((a,b)=>b[1]-a[1])};
function stk(l){let a=0,b=0,w=0,x=0;[...l].sort((p,q)=>p.ts-q.ts).forEach(t=>{if(t.res=='P'){w++;x=0}else if(t.res=='L'){x++;w=0}else{w=x=0}a=Math.max(a,w);b=Math.max(b,x)});return[a,b]}
function dd(l){let c=0,pk=0,m=0;[...l].sort((p,q)=>p.ts-q.ts).forEach(t=>{c+=+t.pl||0;pk=Math.max(pk,c);m=Math.max(m,pk-c)});return m}
function inR(t){const k=dk(t.ts),n=dk(Date.now());switch(F.r){case'today':return k==n;case'week':return k>=wk(n);case'month':return k.slice(0,7)==n.slice(0,7);case'last':return k.slice(0,7)==pm(n);case'cust':return(!F.f||k>=F.f)&&(!F.t||k<=F.t)}return true}
const gb=(o,t)=>{const e=Object.entries(o);if(!e.length)return`<div class="cd"><h3>${t}</h3><p class="mu">No data yet.</p></div>`;const m=Math.max(...e.map(([,x])=>Math.abs(x.net)))||1;return`<div class="cd"><h3>${t}</h3>${e.sort((a,b)=>b[1].net-a[1].net).map(([k,x])=>`<div class="br"><span>${E(k)}<small class="mu"> ${x.n}t · ${Math.round(x.w/x.n*100)}%</small></span><div class="tr"><i style="width:${Math.abs(x.net)/m*100}%;background:var(--${x.net>=0?'g':'r'})"></i></div><b class="${cls(x.net)}">${money(x.net)}</b></div>`).join('')}</div>`};
function eq(l){l=[...l].sort((a,b)=>a.ts-b.ts);let c=0;const p=l.map(t=>c+=+t.pl||0);if(p.length<2)return'<p class="mu">Add at least 2 trades to see the equity curve.</p>';const mn=Math.min(0,...p),mx=Math.max(0,...p),W=600,H=170,y=q=>H-8-(q-mn)/((mx-mn)||1)*(H-16);return`<svg viewBox="0 0 ${W} ${H}" style="width:100%"><line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="var(--bd)"/><polyline points="${p.map((q,i)=>`${i/(p.length-1)*W},${y(q)}`).join(' ')}" fill="none" stroke="var(--au)" stroke-width="2.5"/></svg>`}
function cols(l){l=[...l].sort((a,b)=>a.ts-b.ts).slice(-40);if(!l.length)return'<p class="mu">No trades in this period.</p>';const m=Math.max(...l.map(t=>Math.abs(t.pl)))||1;return`<div class="cols">${l.map(t=>`<i><b style="height:${Math.max(2,Math.abs(t.pl)/m*48)}px;${t.pl<0?'top:50%':'bottom:50%'};background:var(--${t.pl>=0?'g':'r'})"></b></i>`).join('')}</div>`}
function ins(l){if(l.length<5)return['Record at least 5 trades to unlock insights.'];const o=[],s=Object.entries(grp(l,t=>t.session)).filter(([,x])=>x.n>=3).sort((a,b)=>a[1].net-b[1].net)[0];if(s&&s[1].net<0)o.push(`Your weakest session is ${s[0]}: ${money(s[1].net)} over ${s[1].n} trades.`);const m=mcount(l)[0];if(m)o.push(`Most repeated mistake: ${m[0]} (${m[1]}×).`);const y=l.filter(t=>t.plan=='Yes'),n=l.filter(t=>t.plan=='No');if(y.length>=3&&n.length>=3)o.push(`Win rate when you followed your plan: ${st(y).wr.toFixed(0)}% vs ${st(n).wr.toFixed(0)}% when you did not.`);return o.length?o:['No clear pattern yet — keep recording.']}
const csv=l=>{const h=['Date','Day','Time','Instrument','Market','Side','Lot','Entry','SL','TP','Exit','Pips','RR','Strategy','Session','Result','PL','Fees','BalBefore','BalAfter','Feeling','FollowedPlan','Quality','Mistakes','Why','Lesson'],q=x=>`"${String(x??'').replace(/"/g,'""')}"`;return[h.join(',')].concat([...l].sort((a,b)=>a.ts-b.ts).map(t=>[dk(t.ts),new Intl.DateTimeFormat('en-GB',{timeZone:S.tz,weekday:'long'}).format(t.ts),fmtT(t.ts),t.inst,t.market,t.side,t.lot,t.entry,t.sl,t.tp,t.exit,t.pips,t.rr,t.strat,t.session,{P:'Profit',L:'Loss',B:'Break Even'}[t.res],t.pl,t.fees,t.bb,t.ba,t.feel,t.plan,t.q,(t.mt||[]).join('; '),t.why,t.lesson].map(q).join(','))).join('\n')};
const k=(l,x,c='')=>`<div class="k"><small>${l}</small><b class="${c}">${x}</b></div>`;
/* ---------- views ---------- */
function dash(){const l=T.filter(inR),s=st(l);return`<h1>Dashboard</h1><div class="row"><select onchange="F.r=this.value;go()">${[['all','All Time'],['today','Today'],['week','This Week'],['month','This Month'],['last','Last Month'],['cust','Custom Range']].map(([a,b])=>`<option value="${a}" ${F.r==a?'selected':''}>${b}</option>`).join('')}</select>${F.r=='cust'?`<input type="date" value="${F.f}" onchange="F.f=this.value;go()"><input type="date" value="${F.t}" onchange="F.t=this.value;go()">`:''}</div>`+
(!T.length?`<div class="cd"><h3>Welcome</h3><p>No trades yet. Your journal is empty and stays on this device.</p><a class="btn" href="#add">+ Add your first trade</a></div>`:`<div class="g">${k('Total Trades',s.n)}${k('Net P/L',money(s.net),cls(s.net))}${k('Total Profit',money(s.gp),'pos')}${k('Total Loss',money(s.gl),'neg')}${k('Wins',s.w,'pos')}${k('Losses',s.l,'neg')}${k('Break-even',s.b)}${k('Win Rate',s.wr.toFixed(1)+'%')}${k('Avg Profit',money(s.aw),'pos')}${k('Avg Loss',money(s.al),'neg')}${k('Largest Win',money(s.best),'pos')}${k('Largest Loss',money(s.worst),'neg')}${k('Avg R:R',s.rr?'1 : '+s.rr.toFixed(2):'—')}</div><div class="cd"><h3>Equity curve (cumulative P/L)</h3>${eq(l)}</div><div class="cd"><h3>Profit / Loss per trade (last 40)</h3>${cols(l)}</div><div class="cd"><h3>Insights</h3>${ins(T).map(x=>`<p>• ${E(x)}</p>`).join('')}</div>`)}
function add(){const t=EDIT||{},oth=t.inst&&!INS.includes(t.inst);setTimeout(dtl);return`<h1>${EDIT?'Edit Trade':'Add New Trade'}</h1><div class="cd"><p id="dtl" class="au"></p>
<div class="g2">${fi('dt','Date & time ('+tzn()+') — auto, editable',inp(t.ts||Date.now()),'datetime-local','oninput="dtl()"')}<label>Instrument<select id="inst" onchange="mk()">${op([...INS,'Other'],oth?'Other':(t.inst||S.inst))}</select></label><label id="ci" ${oth?'':'hidden'}>Custom instrument<input id="ins" value="${E(oth?t.inst:'')}"></label></div>
<div class="row">${rad('side',[['BUY','BUY','g'],['SELL','SELL','r']],t.side)}</div>
<div class="g2">${fi('lot','Lot size',t.lot)}${fi('entry','Entry price',t.entry)}${fi('exit','Exit price',t.exit)}${fi('pl','Profit / Loss ('+S.cur+')',t.pl)}</div>
<div class="row">${rad('res',[['P','PROFIT','g'],['L','LOSS','r'],['B','BREAK EVEN','n']],t.res)}</div></div>
<details class="cd"><summary>More details (SL, TP, strategy, session, balance, fees)</summary><div class="g2"><label>Market<select id="mkt">${op(['Forex','Metals','Crypto','Indices','Other'],t.market||'Metals')}</select></label>${fi('sl','Stop loss',t.sl)}${fi('tp','Take profit',t.tp)}${fi('strat','Strategy',t.strat,'text')}${sl('ses','Session',SES,t.session)}${fi('fees','Fees / commission / swap',t.fees)}${fi('bb','Balance before',t.bb)}${fi('ba','Balance after',t.ba)}</div><p class="mu">Pips and R:R are calculated from your prices (pips: EURUSD, GBPUSD, USDJPY, XAUUSD only). P/L is never guessed — enter it manually.</p></details>
<details class="cd"><summary>Analysis & psychology</summary><div class="g2">${sl('rs','Main reason for the trade',RS,t.rs)}${sl('fs','Followed strategy?',YN,t.fs)}${sl('fr','Followed rules?',YN,t.fr)}${sl('feel','Feeling before entry',FEEL,t.feel)}${sl('plan','Followed trading plan?',YN,t.plan)}${fi('q','Execution quality (1–10)',t.q,'number','min="1" max="10"')}</div><p id="warn" class="warn" ${t.fr=='No'?'':'hidden'}>⚠ You broke your rules on this trade. Note why below.</p>${ta('why','Why did you enter / why BUY or SELL?',t.why)}${ta('rt','Main reason for profit or loss',t.rt)}</details>
<details class="cd"><summary>Mistakes & lessons</summary><div class="row">${MK.map(m=>`<label class="ch"><input type="checkbox" class="mt" value="${m}" ${(t.mt||[]).includes(m)?'checked':''}><span>${m}</span></label>`).join('')}</div>${ta('mis','What mistake did you make?',t.mis)}${ta('should','What should you have done differently?',t.should)}${ta('lesson','Lesson learned',t.lesson)}${ta('avoid','What will you avoid next trade?',t.avoid)}${ta('imp','My Next Trade Improvement (rule)',t.imp)}</details>
<details class="cd"><summary>Screenshots</summary><label class="btn s">+ Add images (PNG/JPG)<input type="file" accept="image/png,image/jpeg" multiple hidden onchange="addSh(this)"></label><div class="th" id="shots">${shotsH()}</div></details>
<button class="btn" onclick="save()">Save trade</button>${EDIT?'<button class="btn s" onclick="EDIT=null;SH=[];location.hash=\'hist\'">Cancel</button>':''}`}
function dtl(){const x=v('dt');if(x&&$('#dtl')){const t=fromInp(x);$('#dtl').textContent=`${fmtD(t)} · ${fmtT(t)} ${tzn()}`}}
function mk(){const i=v('inst');$('#ci').hidden=i!='Other';if(i!='Other')$('#mkt').value=i=='XAUUSD'?'Metals':i=='BTCUSD'?'Crypto':'Forex'}
const shotsH=()=>SH.map((s,i)=>`<figure><img src="${s.d}" onclick="pv(this.src)"><select onchange="SH[${i}].l=this.value">${op(['Before Entry','During Trade','After Exit'],s.l,'No label')}</select><label class="btn s" style="padding:4px 8px">Replace<input type="file" accept="image/png,image/jpeg" hidden onchange="repSh(${i},this)"></label><button class="btn d" style="padding:4px 8px" onclick="SH.splice(${i},1);$('#shots').innerHTML=shotsH()">Delete</button></figure>`).join('');
const rd=f=>new Promise(r=>{const im=new Image,u=URL.createObjectURL(f);im.onload=()=>{const s=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL('image/jpeg',.82))};im.onerror=()=>r(null);im.src=u});

function hl(){const q=H.q.toLowerCase();let l=T.filter(t=>(!H.i||t.inst==H.i)&&(!H.s||t.side==H.s)&&(!H.r||t.res==H.r)&&(!H.f||dk(t.ts)>=H.f)&&(!H.t||dk(t.ts)<=H.t)&&(!q||[t.inst,t.strat,t.why,t.rt,t.mis,t.lesson,t.imp,...(t.mt||[])].join(' ').toLowerCase().includes(q)));l.sort((a,b)=>H.o=='d'?b.ts-a.ts:a.ts-b.ts);if(!l.length)return'<p class="mu">No trades found.</p>';return`<div class="sc"><table><tr><th>Date</th><th>Time</th><th>Instr.</th><th>Side</th><th>Lot</th><th>Entry</th><th>Exit</th><th>P/L</th><th>Result</th><th></th></tr>${l.map(t=>`<tr class="c" onclick="det('${t.id}')"><td>${fmtD(t.ts)}</td><td>${fmtT(t.ts)}</td><td>${E(t.inst)}</td><td class="${t.side=='BUY'?'pos':'neg'}">${t.side}</td><td>${t.lot??'—'}</td><td>${t.entry??'—'}</td><td>${t.exit??'—'}</td><td class="${cls(t.pl)}">${money(t.pl)}</td><td>${{P:'Profit',L:'Loss',B:'Break Even'}[t.res]}</td><td onclick="event.stopPropagation()"><button class="btn s" onclick="edit('${t.id}')">Edit</button><button class="btn d" onclick="rm('${t.id}')">Del</button></td></tr>`).join('')}</table></div>`}

function det(id){const t=T.find(x=>x.id==id),r=(l,x)=>x||x===0?`<p><b class="mu">${l}:</b> ${E(x)}</p>`:'';ov(`<h2>${E(t.inst)} <span class="${t.side=='BUY'?'pos':'neg'}">${t.side}</span> <span class="${cls(t.pl)}">${money(t.pl)}</span></h2>${r('Date',fmtD(t.ts)+' · '+fmtT(t.ts)+' '+tzn())}${r('Market',t.market)}${r('Lot',t.lot)}${r('Entry',t.entry)}${r('SL',t.sl)}${r('TP',t.tp)}${r('Exit',t.exit)}${r('Pips',t.pips)}${r('R:R',t.rr)}${r('Strategy',t.strat)}${r('Session',t.session)}${r('Fees',t.fees)}${r('Balance before',t.bb)}${r('Balance after',t.ba)}${r('Reason',t.rs)}${r('Why entered',t.why)}${r('Result reason',t.rt)}${r('Followed strategy',t.fs)}${r('Followed rules',t.fr)}${r('Feeling',t.feel)}${r('Followed plan',t.plan)}${r('Quality',t.q)}${r('Mistakes',(t.mt||[]).join(', '))}${r('Mistake',t.mis)}${r('Should have',t.should)}${r('Lesson',t.lesson)}${r('Avoid',t.avoid)}${r('Next trade improvement',t.imp)}<div class="th">${(t.shots||[]).map(s=>`<figure><img src="${s.d}" onclick="pv(this.src)"><figcaption>${E(s.l)}</figcaption></figure>`).join('')}</div><button class="btn" onclick="edit('${t.id}')">Edit</button><button class="btn d" onclick="rm('${t.id}')">Delete</button>`)}

function cal(){CM=CM||dk(Date.now()).slice(0,7);const[y,m]=CM.split('-').map(Number),off=(new Date(Date.UTC(y,m-1,1)).getUTCDay()+6)%7,nd=new Date(Date.UTC(y,m,0)).getUTCDate(),by={};T.forEach(t=>(by[dk(t.ts)]??=[]).push(t));let c='';for(let i=0;i<off;i++)c+='<i></i>';for(let d=1;d<=nd;d++){const key=`${CM}-${String(d).padStart(2,'0')}`,l=by[key],net=l?st(l).net:0;c+=`<a onclick="CD='${key}';go()" style="background:${!l?'var(--bd)':net>0?'var(--g)':net<0?'var(--r)':'#eab308'};${!l?'color:var(--mu)':''};${CD==key?'outline:2px solid var(--au)':''}">${d}${l?`<br><small>${money(net)}</small>`:''}</a>`}
const dl2=CD&&by[CD]?`<div class="cd"><h3>${fmtD(fromInp(CD+'T12:00'))} — Net <span class="${cls(st(by[CD]).net)}">${money(st(by[CD]).net)}</span></h3>${by[CD].sort((a,b)=>a.ts-b.ts).map(t=>`<p onclick="det('${t.id}')" style="cursor:pointer">${fmtT(t.ts)} · ${E(t.inst)} <b class="${t.side=='BUY'?'pos':'neg'}">${t.side}</b> · <span class="${cls(t.pl)}">${money(t.pl)}</span></p>`).join('')}</div>`:CD?`<div class="cd"><p class="mu">No trades on this day.</p></div>`:'';
return`<h1>Calendar</h1><div class="row"><button class="btn s" onclick="sm(-1)">‹</button><b>${new Date(Date.UTC(y,m-1,1)).toLocaleString('en',{month:'long',year:'numeric',timeZone:'UTC'})}</b><button class="btn s" onclick="sm(1)">›</button></div><div class="cal">${['M','T','W','T','F','S','S'].map(x=>`<small class="mu">${x}</small>`).join('')}${c}</div><p class="mu">Green = profit · Red = loss · Yellow = break-even · Grey = no trades</p>${dl2}`}

function ana(){if(!T.length)return'<h1>Analytics</h1><div class="cd"><p class="mu">Add trades to see analytics.</p></div>';const s=st(T),[a,b]=stk(T),D=new Intl.DateTimeFormat('en-GB',{timeZone:S.tz,weekday:'long'});return`<h1>Analytics</h1><div class="g">${k('Win Rate',s.wr.toFixed(1)+'%')}${k('Avg R:R',s.rr?'1 : '+s.rr.toFixed(2):'—')}${k('Max win streak',a,'pos')}${k('Max loss streak',b,'neg')}${k('Max drawdown',T.length>1?money(-dd(T)):'—','neg')}</div><p class="mu">Drawdown is based on recorded trade P/L, not account balance.</p><div class="cd"><h3>Profit vs Loss</h3>${cols(T)}</div><div class="cd"><h3>Insights</h3>${ins(T).map(x=>`<p>• ${E(x)}</p>`).join('')}</div>${gb(grp(T,t=>t.side),'BUY vs SELL')}${gb(grp(T,t=>t.inst),'By instrument')}${gb(grp(T,t=>t.session),'By session')}${gb(grp(T,t=>t.strat),'By strategy')}${gb(grp(T,t=>t.feel),'By feeling before entry')}${gb(grp(T,t=>t.plan&&'Plan followed: '+t.plan),'By plan adherence')}${gb(grp(T,t=>D.format(t.ts)),'By weekday')}${gb(grp(T,t=>wk(dk(t.ts))),'Weekly (week start)')}${gb(grp(T,t=>dk(t.ts).slice(0,7)),'Monthly')}${gb(Object.fromEntries(Object.entries(grp(T,t=>dk(t.ts))).sort().slice(-14)),'Daily (last 14 days)')}`}
function mis(){const n=dk(Date.now()),w=wk(n),m=n.slice(0,7),c=mcount(T),ct=(k,f)=>T.filter(t=>f(dk(t.ts))&&(t.mt||[]).includes(k)).length,stt=k=>M.find(x=>x.name==k)?.status||'Not Improved',fx=c.filter(([k])=>stt(k)=='Fixed').length;return`<h1>Mistake Tracker</h1>`+(!c.length?'<div class="cd"><p class="mu">No mistakes tagged yet. Tag them inside a trade under “Mistakes & lessons”.</p></div>':`<div class="g">${k('Most repeated',E(c[0][0]))}${k('Occurrences',c[0][1])}${k('Fixed',fx+' / '+c.length,'pos')}</div><div class="cd sc"><table><tr><th>Mistake</th><th>Total</th><th>This week</th><th>This month</th><th>Status</th></tr>${c.map(([x,q])=>`<tr><td>${E(x)}</td><td>${q}</td><td>${ct(x,d=>d>=w)}</td><td>${ct(x,d=>d.slice(0,7)==m)}</td><td><select onchange="sms('${x}',this.value)">${op(['Not Improved','Improving','Fixed'],stt(x))}</select></td></tr>`).join('')}</table></div>`)+`<div class="cd"><h3>My Next Trade Improvement rules</h3>${T.filter(t=>t.imp).sort((a,b)=>b.ts-a.ts).slice(0,8).map(t=>`<p>• ${E(t.imp)} <small class="mu">${fmtD(t.ts)}</small></p>`).join('')||'<p class="mu">None yet.</p>'}</div>`}
